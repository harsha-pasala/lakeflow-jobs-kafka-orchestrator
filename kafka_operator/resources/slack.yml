resources:
  jobs:
    send_slack_message:
      name: "[example] send_slack_message"

      tasks:
        - task_key: slack
          environment_key: default
          python_operator_task:
            main: kafka_operator.examples.slack.send_slack_message
            parameters:
            - name: "conn_id"
              value: "CHANGEME"
            - name: "text"
              value: "Hello, World"
            - name: "channel"
              value: "C0A874NCL8N"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
