resources:
  jobs:
    sum_task:
      name: "[example] sum_task"

      tasks:
        - task_key: sum_task
          environment_key: default
          python_operator_task:
            main: kafka_operator.examples.math.sum_task
            parameters:
            - name: "a"
              value: "1"
            - name: "b"
              value: "2"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
