resources:
  jobs:
    kafka_message_sensor:
      name: kafka_message_sensor

      tasks:
        - task_key: kafka_message_sensor
          environment_key: default
          python_operator_task:
            main: kafka_operator.kafka_message_sensor.KafkaMessageSensor
            parameters:
              - name: task_key
                value: "{{task.name}}"
              - name: topic
                value: ${var.sensor_topic}
              - name: group_id
                value: "kafka-sensor-{{job.id}}-{{job.run_id}}"
              - name: bootstrap_servers
                value: ${var.bootstrap_servers}
              - name: secret_scope
                value: ${var.secret_scope}
              - name: secret_key
                value: ${var.secret_key}
              # Optional parameters (Python defaults apply if omitted):
              # Set match_value_contains to trigger only on messages whose body
              # contains this substring. Omit it (or leave empty) to trigger on
              # any message received on the topic.
              - name: match_value_contains
                value: ${var.sensor_match_value}
              # - name: defer_seconds
              #   value: "30"
              # - name: timeout_seconds
              #   value: "900"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
