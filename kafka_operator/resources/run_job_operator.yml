resources:
  jobs:
    run_job_operator:
      name: "[example] run_job_operator"

      tasks:
        - task_key: run_job_operator
          environment_key: default
          python_operator_task:
            main: kafka_operator.examples.run_job_operator.RunJobOperator
            parameters:
            - name: "task_key"
              value: "{{task.name}}"
            - name: "job_id"
              value: "${resources.jobs.sum_task.id}"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
