[project]
name = "kafka_operator"
version = "0.0.1"
authors = []
requires-python = ">=3.10,<3.13"
dependencies = [
    "confluent-kafka>=2.5.0,<3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/python_operator_task",
    "src/kafka_operator",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
